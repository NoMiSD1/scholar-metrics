name: Update Google Scholar Metrics

on:
  # Jeden Montag und Donnerstag um 04:00 UTC
  schedule:
    - cron: "0 4 * * 1,4"

  # Ermöglicht manuellen Start zum Testen
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-metrics-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch Google Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python update_scholar.py

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- metrics.json scholar-metrics.svg

          for directory in metrics svg charts; do
            if [ -d "$directory" ] && find "$directory" -type f -print -quit | grep -q .; then
              git add -A -- "$directory"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to metrics."
          else
            git commit -m "Update Google Scholar metrics"
            git push
          fi
