name: Update Google Scholar Metrics

on:
  # Jeden Sonntag um 06:00 UTC
  schedule:
    - cron: "0 6 * * 0"

  # Ermöglicht manuellen Start zum Testen
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch Google Scholar metrics
        run: python update_scholar.py

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics.json

          if git diff --cached --quiet; then
            echo "No changes to metrics."
          else
            git commit -m "Update Google Scholar metrics"
            git push
          fi
