<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Google Scholar metrics and citations per year</title>
  <desc id="chart-description">1,527 citations, h-index 19, i10-index 24. Citation counts by year; the current year is year to date.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444444"><tspan font-weight="bold">1,527</tspan><tspan> citations · h-index </tspan><tspan font-weight="bold">19</tspan><tspan> · i10-index </tspan><tspan font-weight="bold">24</tspan></text>
    <text x="46" y="45" font-size="13" font-weight="bold" fill="#444444">Citations per year</text>
    <line x1="46" y1="190" x2="510" y2="190" stroke="#e5e5e5" stroke-width="1"/>
    <text x="39" y="193" text-anchor="end" font-size="9" fill="#666666">0</text>
    <line x1="46" y1="158.5" x2="510" y2="158.5" stroke="#e5e5e5" stroke-width="1"/>
    <text x="39" y="161.5" text-anchor="end" font-size="9" fill="#666666">57</text>
    <line x1="46" y1="127" x2="510" y2="127" stroke="#e5e5e5" stroke-width="1"/>
    <text x="39" y="130" text-anchor="end" font-size="9" fill="#666666">114</text>
    <line x1="46" y1="95.5" x2="510" y2="95.5" stroke="#e5e5e5" stroke-width="1"/>
    <text x="39" y="98.5" text-anchor="end" font-size="9" fill="#666666">171</text>
    <line x1="46" y1="64" x2="510" y2="64" stroke="#e5e5e5" stroke-width="1"/>
    <text x="39" y="67" text-anchor="end" font-size="9" fill="#666666">228</text>
    <rect x="57.2" y="168.45" width="24" height="21.55" fill="#00549F"><title>2017: 39 citations</title></rect>
    <text x="69.2" y="164.45" text-anchor="middle" font-size="9" fill="#444444">39</text>
    <text x="69.2" y="208" text-anchor="middle" font-size="9" fill="#555555">2017</text>
    <rect x="103.6" y="145.79" width="24" height="44.21" fill="#00549F"><title>2018: 80 citations</title></rect>
    <text x="115.6" y="141.79" text-anchor="middle" font-size="9" fill="#444444">80</text>
    <text x="115.6" y="208" text-anchor="middle" font-size="9" fill="#555555">2018</text>
    <rect x="150" y="129.76" width="24" height="60.24" fill="#00549F"><title>2019: 109 citations</title></rect>
    <text x="162" y="125.76" text-anchor="middle" font-size="9" fill="#444444">109</text>
    <text x="162" y="208" text-anchor="middle" font-size="9" fill="#555555">2019</text>
    <rect x="196.4" y="113.74" width="24" height="76.26" fill="#00549F"><title>2020: 138 citations</title></rect>
    <text x="208.4" y="109.74" text-anchor="middle" font-size="9" fill="#444444">138</text>
    <text x="208.4" y="208" text-anchor="middle" font-size="9" fill="#555555">2020</text>
    <rect x="242.8" y="97.16" width="24" height="92.84" fill="#00549F"><title>2021: 168 citations</title></rect>
    <text x="254.8" y="93.16" text-anchor="middle" font-size="9" fill="#444444">168</text>
    <text x="254.8" y="208" text-anchor="middle" font-size="9" fill="#555555">2021</text>
    <rect x="289.2" y="77.26" width="24" height="112.74" fill="#00549F"><title>2022: 204 citations</title></rect>
    <text x="301.2" y="73.26" text-anchor="middle" font-size="9" fill="#444444">204</text>
    <text x="301.2" y="208" text-anchor="middle" font-size="9" fill="#555555">2022</text>
    <rect x="335.6" y="92.74" width="24" height="97.26" fill="#00549F"><title>2023: 176 citations</title></rect>
    <text x="347.6" y="88.74" text-anchor="middle" font-size="9" fill="#444444">176</text>
    <text x="347.6" y="208" text-anchor="middle" font-size="9" fill="#555555">2023</text>
    <rect x="382" y="77.26" width="24" height="112.74" fill="#00549F"><title>2024: 204 citations</title></rect>
    <text x="394" y="73.26" text-anchor="middle" font-size="9" fill="#444444">204</text>
    <text x="394" y="208" text-anchor="middle" font-size="9" fill="#555555">2024</text>
    <rect x="428.4" y="65.66" width="24" height="124.34" fill="#00549F"><title>2025: 225 citations</title></rect>
    <text x="440.4" y="61.66" text-anchor="middle" font-size="9" fill="#444444">225</text>
    <text x="440.4" y="208" text-anchor="middle" font-size="9" fill="#555555">2025</text>
    <rect x="474.8" y="96.05" width="24" height="93.95" fill="#00549F"><title>2026: 170 citations</title></rect>
    <text x="486.8" y="92.05" text-anchor="middle" font-size="9" fill="#444444">170</text>
    <text x="486.8" y="208" text-anchor="middle" font-size="9" fill="#555555">2026*</text>
    <text x="510" y="233" text-anchor="end" font-size="9" fill="#666666">* year to date</text>
  </g>
</svg>
