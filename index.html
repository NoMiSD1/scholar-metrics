<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    color: #4a4a4a;
    overflow: hidden;
  }

  #metrics {
    white-space: nowrap;
    line-height: 24px;
  }

  .value {
    font-weight: bold;
  }
</style>
</head>

<body>

<div id="metrics">
  <span class="value" id="citations">–</span> citations
  &nbsp;·&nbsp;
  h-index <span class="value" id="hindex">–</span>
  &nbsp;·&nbsp;
  i10-index <span class="value" id="i10index">–</span>
</div>

<script>
fetch("metrics.json")
  .then(response => response.json())
  .then(data => {
    document.getElementById("citations").textContent = data.citations;
    document.getElementById("hindex").textContent = data.hindex;
    document.getElementById("i10index").textContent = data.i10index;
  });
</script>

</body>
</html>
